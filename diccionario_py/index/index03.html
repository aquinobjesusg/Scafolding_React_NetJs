<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diccionario Interactivo - Aprende Inglés</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #E0E0E0;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 280px;
            height: 100vh;
            background-color: #000000;
            color: white;
            padding: 20px;
            overflow-y: auto;
            z-index: 100;
        }

        .sidebar h3 {
            color: #FFEB3B;
            margin-bottom: 20px;
            text-align: center;
        }

        .sidebar select, .sidebar input, .sidebar .multiselect-container {
            width: 100%;
            padding: 8px;
            margin: 8px 0;
            background-color: #FFFFFF;
            color: #000000;
            font-weight: bold;
            border: none;
            border-radius: 4px;
        }

        .sidebar button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background-color: #0044CC;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .sidebar button:hover {
            background-color: #003399;
        }

        .modo-reforzando {
            background-color: #FFD600;
            color: #000;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            font-weight: 900;
            margin: 10px 0;
        }

        .count-label {
            color: #FFEB3B;
            font-weight: 900;
            font-size: 18px;
            display: block;
            text-align: center;
            margin: 10px 0;
        }

        .cerrar-sesion {
            background-color: #D32F2F !important;
        }

        .cerrar-sesion:hover {
            background-color: #B71C1C !important;
        }

        /* Main Content */
        .main-content {
            margin-left: 280px;
            padding: 20px;
        }

        /* Banner Usuario */
        .banner-usuario {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 5px solid #FFD600;
        }

        /* Botones de menú */
        .menu-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .menu-btn {
            flex: 1;
            padding: 12px;
            background-color: #0044CC;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .menu-btn:hover {
            transform: translateY(-2px);
            background-color: #003399;
        }

        .menu-btn.active {
            background-color: #FFD600;
            color: #000;
        }

        /* Header */
        .main-header {
            background: #0044CC;
            color: white;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }

        /* Word Box */
        .word-box {
            background-color: #FDFDFD;
            padding: 25px;
            border-radius: 15px;
            border-left: 12px solid #FFD600;
            color: #000;
            box-shadow: 4px 4px 10px rgba(0,0,0,0.1);
            margin: 20px 0;
        }

        .word-box h3 {
            color: #666;
            margin-bottom: 10px;
        }

        .word-box h1 {
            font-size: 2.5em;
            word-break: break-word;
        }

        /* Stat Box */
        .stat-box {
            background: #f0f0f0;
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            font-weight: 900;
            color: #000;
        }

        .stats-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            flex: 1;
        }

        /* Input de respuesta */
        .respuesta-input {
            width: 100%;
            padding: 15px;
            font-size: 1.2em;
            border: 2px solid #ccc;
            border-radius: 10px;
            margin: 15px 0;
        }

        /* Botones de acción */
        .action-btn {
            padding: 12px 24px;
            background-color: #0044CC;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
        }

        .action-btn-success {
            background-color: #2E7D32;
        }

        .action-btn-danger {
            background-color: #D32F2F;
        }

        /* Auth Card */
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .auth-card {
            background-color: #F5F5F5;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            width: 400px;
            max-width: 90%;
        }

        .auth-card h2 {
            color: #0044CC;
            margin-bottom: 20px;
        }

        .auth-card input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        .auth-card button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background-color: #0044CC;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Lista de repaso */
        .review-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: white;
            margin: 8px 0;
            border-radius: 8px;
            border-left: 4px solid #0044CC;
        }

        .review-text {
            font-weight: bold;
            flex: 1;
        }

        .review-buttons button {
            margin-left: 8px;
            padding: 5px 12px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }

        /* Alertas */
        .alert-success {
            background-color: #4CAF50;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
        }

        .alert-error {
            background-color: #f44336;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
        }

        .alert-warning {
            background-color: #ff9800;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }
            .main-content {
                margin-left: 0;
            }
            .menu-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
<div id="app"></div>

<script>
    // =============================================================================
    // DATOS DE EJEMPLO (SIMULANDO BASE DE DATOS)
    // =============================================================================
    const datosEjemplo = {
        palabras_nivel1: [
            { id: 1, ingles: "House", español: "Casa", tipo: "Sustantivo", nivel: 1 },
            { id: 2, ingles: "Dog", español: "Perro", tipo: "Sustantivo", nivel: 1 },
            { id: 3, ingles: "Run", español: "Correr", tipo: "Verbo", nivel: 1 },
            { id: 4, ingles: "Beautiful", español: "Hermoso", tipo: "Adjetivo", nivel: 1 },
            { id: 5, ingles: "Quickly", español: "Rápidamente", tipo: "Adverbio", nivel: 1 },
            { id: 6, ingles: "Big", español: "Grande", tipo: "Adjetivo", nivel: 1 },
            { id: 7, ingles: "Small", español: "Pequeño", tipo: "Adjetivo", nivel: 1 },
            { id: 8, ingles: "Eat", español: "Comer", tipo: "Verbo", nivel: 1 },
            { id: 9, ingles: "Drink", español: "Beber", tipo: "Verbo", nivel: 1 },
            { id: 10, ingles: "Happy", español: "Feliz", tipo: "Adjetivo", nivel: 1 }
        ],
        palabras_nivel2: [
            { id: 11, ingles: "Understanding", español: "Comprensión", tipo: "Sustantivo", nivel: 2 },
            { id: 12, ingles: "Development", español: "Desarrollo", tipo: "Sustantivo", nivel: 2 },
            { id: 13, ingles: "Investigate", español: "Investigar", tipo: "Verbo", nivel: 2 },
            { id: 14, ingles: "Fascinating", español: "Fascinante", tipo: "Adjetivo", nivel: 2 }
        ],
        palabras_nivel3: [
            { id: 15, ingles: "Paradigm", español: "Paradigma", tipo: "Sustantivo", nivel: 3 },
            { id: 16, ingles: "Synthesize", español: "Sintetizar", tipo: "Verbo", nivel: 3 }
        ]
    };

    // Estado global de la aplicación
    let state = {
        auth: false,
        usuarioActual: null,
        data: [],
        totalP: 0,
        jugando: false,
        menuActual: "REPASO",
        idxEntrena: 0,
        entStep: 0,
        jPaso: 1,
        jVistos: new Set(),
        jFallidosDict: {},
        catActiva: "Palabras",
        nivActivo: 1,
        idiomaOri: "Español",
        rIni: 1,
        rFin: 20,
        modoFallaActivo: false,
        subsetFallas: [],
        viendoResumen: false,
        ayudaJuego: "Con Ayuda",
        modJ: "Escritura",
        ordenJ: "Serial",
        aciertos: 0,
        fallos: 0,
        jIndices: [],
        cIdx: 0,
        tempAns: "",
        autoEntrena: false,
        authStep: "inicio",
        mensaje: null,
        mensajeTipo: null
    };

    // Función para mostrar mensajes
    function showMessage(message, type) {
        state.mensaje = message;
        state.mensajeTipo = type;
        render();
        setTimeout(() => {
            state.mensaje = null;
            render();
        }, 3000);
    }

    // Cargar datos según filtros
    function cargarDatos() {
        let todas = [];
        if (state.catActiva === "Palabras") {
            if (state.nivActivo === 1) todas = [...datosEjemplo.palabras_nivel1];
            else if (state.nivActivo === 2) todas = [...datosEjemplo.palabras_nivel2];
            else todas = [...datosEjemplo.palabras_nivel3];
        }

        // Aplicar filtro de rango
        const start = (state.rIni - 1);
        const end = state.rFin;
        const datosFiltrados = todas.slice(start, end);
        
        state.data = datosFiltrados;
        state.totalP = datosFiltrados.length;
        showMessage(`✅ Cargados ${state.totalP} registros`, "success");
        render();
    }

    // Obtener palabra según índice
    function obtenerPalabra(idx) {
        if (!state.data[idx]) return { pregunta: "---", respuesta: "---", lang: "en" };
        const palabra = state.data[idx];
        if (state.idiomaOri === "Español") {
            return { pregunta: palabra.español, respuesta: palabra.ingles, lang: "en" };
        } else {
            return { pregunta: palabra.ingles, respuesta: palabra.español, lang: "es" };
        }
    }

    // Texto a voz
    function speak(text, lang) {
        if (!text) return;
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang === "en" ? "en-US" : "es-ES";
        utterance.rate = 0.9;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utterance);
    }

    // Iniciar juego
    function iniciarJuego() {
        let indices = [];
        for (let i = 0; i < state.data.length; i++) {
            indices.push(i);
        }
        if (state.ordenJ === "Aleatorio") {
            for (let i = indices.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [indices[i], indices[j]] = [indices[j], indices[i]];
            }
        }
        state.jIndices = indices;
        state.aciertos = 0;
        state.fallos = 0;
        state.jugando = true;
        state.jPaso = 1;
        state.jVistos = new Set();
        state.jFallidosDict = {};
        state.cIdx = indices[0];
        state.tempAns = "";
        render();
    }

    // Comprobar respuesta
    function comprobarRespuesta() {
        const palabra = obtenerPalabra(state.cIdx);
        let respuestaUsuario = "";
        
        if (state.modJ === "Pronunciación") {
            respuestaUsuario = state.tempAns.toLowerCase().trim();
        } else {
            const input = document.getElementById("respuestaInput");
            if (input) respuestaUsuario = input.value.toLowerCase().trim();
        }

        const sinonimos = palabra.respuesta.toLowerCase().split('/');
        const esCorrecto = sinonimos.some(s => s.trim() === respuestaUsuario);

        if (esCorrecto) {
            state.aciertos++;
            state.jStatus = "OK";
        } else {
            state.fallos++;
            state.jStatus = "ERR";
            state.jFallidosDict[palabra.pregunta] = { traduccion: palabra.respuesta };
        }

        state.jVistos.add(state.cIdx);
        state.jPaso = 3;
        render();
    }

    // Siguiente palabra en juego
    function siguientePalabra() {
        const pendientes = state.jIndices.filter(i => !state.jVistos.has(i));
        if (pendientes.length > 0) {
            state.cIdx = pendientes[0];
            state.jPaso = 1;
            state.tempAns = "";
            render();
        } else {
            // Juego terminado
            state.jugando = false;
            state.viendoResumen = true;
            render();
        }
    }

    // Reforzar fallas
    function reforzarFallas() {
        if (Object.keys(state.jFallidosDict).length > 0) {
            const nuevasFallas = [];
            for (const [preg, info] of Object.entries(state.jFallidosDict)) {
                nuevasFallas.push({ 
                    pregunta: preg, 
                    respuesta: info.traduccion,
                    ingles: state.idiomaOri === "Español" ? info.traduccion : preg,
                    español: state.idiomaOri === "Español" ? preg : info.traduccion
                });
            }
            state.data = nuevasFallas;
            state.totalP = nuevasFallas.length;
            state.modoFallaActivo = true;
            state.menuActual = "REPASO";
            state.jugando = false;
            state.viendoResumen = false;
            render();
        } else {
            showMessage("No hay fallas para reforzar", "warning");
        }
    }

    // Renderizado principal con Reactividad
    let root = document.getElementById("app");

    function render() {
        if (!root) return;
        
        // Pantalla de autenticación si no está logueado
        if (!state.auth) {
            renderAuth();
            return;
        }
        
        renderMain();
    }

    function renderAuth() {
        if (state.authStep === "inicio") {
            root.innerHTML = `
                <div class="auth-container">
                    <div class="auth-card">
                        <div style="font-size: 60px;">🎓</div>
                        <h2>DICCIONARIO INTERACTIVO</h2>
                        <button onclick="setAuthStep('login')">INICIAR SESIÓN</button>
                        <button onclick="setAuthStep('registro')">CREAR UNA CUENTA</button>
                    </div>
                </div>
            `;
        } else if (state.authStep === "login") {
            root.innerHTML = `
                <div class="auth-container">
                    <div class="auth-card">
                        <h2>🔐 Ingreso de Usuario</h2>
                        <input type="password" id="loginPass" placeholder="Contraseña">
                        <button onclick="doLogin()">ENTRAR</button>
                        <button onclick="setAuthStep('recuperar')">¿Olvidaste tu contraseña?</button>
                        <button onclick="setAuthStep('inicio')">VOLVER</button>
                    </div>
                </div>
            `;
        } else if (state.authStep === "registro") {
            root.innerHTML = `
                <div class="auth-container">
                    <div class="auth-card">
                        <h2>📝 Registro de Nuevo Usuario</h2>
                        <input type="text" id="regNombre" placeholder="Nombre Completo">
                        <input type="email" id="regCorreo" placeholder="Correo Electrónico">
                        <input type="text" id="regAlias" placeholder="Alias">
                        <select id="regNivel">
                            <option>Básico</option>
                            <option>Intermedio</option>
                            <option>Avanzado</option>
                        </select>
                        <button onclick="doRegistro()">REGISTRARSE</button>
                        <button onclick="setAuthStep('inicio')">CANCELAR</button>
                    </div>
                </div>
            `;
        } else if (state.authStep === "recuperar") {
            root.innerHTML = `
                <div class="auth-container">
                    <div class="auth-card">
                        <h2>🔑 Recuperar Acceso</h2>
                        <input type="email" id="recuperarEmail" placeholder="Correo registrado">
                        <button onclick="doRecuperar()">ENVIAR ENLACE</button>
                        <button onclick="setAuthStep('inicio')">VOLVER</button>
                    </div>
                </div>
            `;
        }
    }

    function renderMain() {
        const sidebarHtml = renderSidebar();
        const mainHtml = renderMainContent();
        
        root.innerHTML = `
            <div class="sidebar">
                ${sidebarHtml}
            </div>
            <div class="main-content">
                <div class="banner-usuario">
                    <span>● SESIÓN ACTIVA</span>
                    <span style="font-weight:bold;">${state.usuarioActual || "USUARIO"}</span>
                </div>
                ${state.mensaje ? `<div class="alert-${state.mensajeTipo}">${state.mensaje}</div>` : ''}
                ${mainHtml}
            </div>
        `;
        
        // Reproducir audio automático si es necesario
        if (state.jugando && state.jPaso === 1 && state.modJ === "Voz") {
            const palabra = obtenerPalabra(state.cIdx);
            setTimeout(() => speak(palabra.respuesta, palabra.lang), 500);
        }
    }

    function renderSidebar() {
        if (state.jugando) {
            return `
                <h3>⚙️ PANEL DE CONTROL</h3>
                <div style="background:#e3f2fd; padding:10px; border-radius:5px; margin:10px 0;">
                    <small>ESTÁS JUGANDO EN:</small><br>
                    <strong>🎯 ${state.modJ.toUpperCase()}</strong><br>
                    <strong>💡 ${state.ayudaJuego.toUpperCase()}</strong>
                </div>
                <button onclick="verResumen()">📊 VER FALLAS + PENDIENTES</button>
                <button class="cerrar-sesion" onclick="abortarJuego()">❌ ABORTAR JUEGO</button>
                <button class="cerrar-sesion" onclick="cerrarSesion()">🚪 CERRAR SESIÓN</button>
            `;
        }
        
        return `
            <h3>⚙️ PANEL DE CONTROL</h3>
            <label>Idioma Origen:</label>
            <select id="idiomaOri" onchange="cambiarIdioma()">
                <option ${state.idiomaOri === "Español" ? "selected" : ""}>Español</option>
                <option ${state.idiomaOri === "Inglés" ? "selected" : ""}>Inglés</option>
            </select>
            
            <label>Categoría:</label>
            <select id="categoria" onchange="cambiarCategoria()">
                <option ${state.catActiva === "Palabras" ? "selected" : ""}>Palabras</option>
                <option disabled>Modismos</option>
                <option disabled>Verbos Compuestos</option>
            </select>
            
            <label>NIVEL:</label>
            <div style="display:flex; gap:5px;">
                <button style="flex:1;" onclick="cambiarNivel(1)" class="${state.nivActivo === 1 ? 'active' : ''}">NIVEL 1</button>
                <button style="flex:1;" onclick="cambiarNivel(2)" class="${state.nivActivo === 2 ? 'active' : ''}">NIVEL 2</button>
                <button style="flex:1;" onclick="cambiarNivel(3)" class="${state.nivActivo === 3 ? 'active' : ''}">NIVEL 3</button>
            </div>
            
            <button onclick="cargarDatos()">🔄 CARGAR / ACTUALIZAR NUEVA DATA</button>
            
            ${state.totalP > 0 ? `
                ${state.modoFallaActivo ? '<div class="modo-reforzando">⚠️ MODO: REFORZANDO FALLAS</div>' : `<div class="count-label">Total en DB: ${state.totalP}</div>`}
                <label>Desde:</label>
                <input type="number" id="rIni" value="${state.rIni}" min="1" max="${state.totalP}" onchange="actualizarRango()">
                <label>Hasta:</label>
                <input type="number" id="rFin" value="${state.rFin}" min="1" max="${state.totalP}" onchange="actualizarRango()">
            ` : ''}
            
            <button class="cerrar-sesion" onclick="cerrarSesion()">🚪 CERRAR SESIÓN</button>
        `;
    }

    function renderMainContent() {
        if (state.viendoResumen) {
            return renderResumen();
        }
        
        if (state.menuActual === "REPASO") {
            return renderRepaso();
        } else if (state.menuActual === "ENTRENA") {
            return renderEntrena();
        } else if (state.menuActual === "JUEGO") {
            if (!state.jugando) return renderConfigJuego();
            else return renderJuegoActivo();
        }
        
        // Menú principal
        return `
            <div class="menu-buttons">
                <button class="menu-btn ${state.menuActual === "REPASO" ? 'active' : ''}" onclick="setMenu('REPASO')">📋 REPASO</button>
                <button class="menu-btn ${state.menuActual === "ENTRENA" ? 'active' : ''}" onclick="setMenu('ENTRENA')">🎧 ENTRENA</button>
                <button class="menu-btn ${state.menuActual === "JUEGO" ? 'active' : ''}" onclick="setMenu('JUEGO')">🎯 JUEGO</button>
            </div>
            <div class="main-header">
                <h3>${state.catActiva.toUpperCase()} - NIVEL ${state.nivActivo}</h3>
            </div>
            ${state.data.length === 0 ? '<div class="alert-warning">No hay datos cargados. Usa el panel lateral para cargar palabras.</div>' : renderRepaso()}
        `;
    }

    function renderConfigJuego() {
        return `
            <div class="main-header"><h3>🎯 CONFIGURACIÓN DE LA PARTIDA</h3></div>
            <div style="display:flex; gap:15px; margin-bottom:20px;">
                <div style="flex:1;">
                    <label>Modalidad:</label>
                    <select id="modJ" style="width:100%; padding:8px;">
                        <option ${state.modJ === "Escritura" ? "selected" : ""}>Escritura</option>
                        <option ${state.modJ === "Voz" ? "selected" : ""}>Voz</option>
                        <option ${state.modJ === "Pronunciación" ? "selected" : ""}>Pronunciación</option>
                    </select>
                </div>
                <div style="flex:1;">
                    <label>Orden:</label>
                    <select id="ordenJ" style="width:100%; padding:8px;">
                        <option ${state.ordenJ === "Serial" ? "selected" : ""}>Serial</option>
                        <option ${state.ordenJ === "Aleatorio" ? "selected" : ""}>Aleatorio</option>
                    </select>
                </div>
                <div style="flex:1;">
                    <label>Ayuda:</label>
                    <select id="ayudaJ" style="width:100%; padding:8px;">
                        <option ${state.ayudaJuego === "Con Ayuda" ? "selected" : ""}>Con Ayuda</option>
                        <option ${state.ayudaJuego === "Sin Ayuda" ? "selected" : ""}>Sin Ayuda</option>
                    </select>
                </div>
            </div>
            <button class="action-btn" onclick="iniciarJuegoConfig()">🚀 INICIAR JUEGO</button>
        `;
    }

    function renderJuegoActivo() {
        const pendientes = state.jIndices.filter(i => !state.jVistos.has(i));
        if (pendientes.length === 0) {
            return renderFinJuego();
        }
        
        const palabra = obtenerPalabra(state.cIdx);
        const progreso = `${state.jVistos.size + 1}/${state.jIndices.length}`;
        
        let contenidoPaso = "";
        if (state.jPaso === 1) {
            if (state.modJ === "Voz") {
                contenidoPaso = `
                    <div class="word-box">
                        <h3>TRADUCE EL AUDIO:</h3>
                        <h1>🔊 Escucha atentamente...</h1>
                    </div>
                    <button class="action-btn" onclick="reproducirAudioActual()">🔊 Reproducir audio</button>
                `;
            } else {
                contenidoPaso = `
                    <div class="word-box">
                        <h3>TRADUCE:</h3>
                        <h1>${palabra.pregunta}</h1>
                    </div>
                    ${state.ayudaJuego === "Con Ayuda" ? `<button class="action-btn" onclick="reproducirAudioActual()">🔊 Escuchar pronunciación</button>` : ''}
                `;
            }
            contenidoPaso += `<button class="action-btn" onclick="siguientePaso()">CONTINUAR ➔</button>`;
        } else if (state.jPaso === 2) {
            contenidoPaso = `
                <div class="word-box">
                    <h3>EXPRESIÓN: ${palabra.pregunta}</h3>
                </div>
            `;
            if (state.modJ === "Pronunciación") {
                contenidoPaso += `
                    <button class="action-btn" onclick="iniciarGrabacion()">🎤 Grabar pronunciación</button>
                    <input type="text" id="respuestaInput" class="respuesta-input" placeholder="O escribe tu respuesta...">
                `;
            } else {
                contenidoPaso += `<input type="text" id="respuestaInput" class="respuesta-input" placeholder="Escribe tu respuesta...">`;
            }
            contenidoPaso += `<button class="action-btn action-btn-success" onclick="comprobarRespuestaWrapper()">COMPROBAR</button>`;
        } else if (state.jPaso === 3) {
            const colorBorde = state.jStatus === "OK" ? "#2E7D32" : "#D32F2F";
            contenidoPaso = `
                <div class="word-box" style="border-left-color:${colorBorde};">
                    <h3>ORIGEN:</h3>
                    <h1>${palabra.pregunta}</h1>
                    <hr>
                    <h3>TRADUCCIÓN CORRECTA:</h3>
                    <h1 style="color:${colorBorde};">${palabra.respuesta}</h1>
                </div>
                <button class="action-btn" onclick="reproducirAudioRespuesta()">🔊 OÍR PRONUNCIACIÓN</button>
                <button class="action-btn action-btn-success" onclick="siguientePalabraWrapper()">SIGUIENTE ➔</button>
            `;
        }
        
        return `
            <div class="stats-container">
                <div class="stat-card"><div class="stat-box">Progreso: ${progreso}</div></div>
                <div class="stat-card"><div class="stat-box" style="color:green;">✅ Aciertos: ${state.aciertos}</div></div>
                <div class="stat-card"><div class="stat-box" style="color:red;">❌ Fallos: ${state.fallos}</div></div>
            </div>
            ${contenidoPaso}
        `;
    }

    function renderFinJuego() {
        let fallosHtml = "";
        if (Object.keys(state.jFallidosDict).length > 0) {
            fallosHtml = `<div style="max-height:300px; overflow-y:auto;">`;
            for (const [preg, info] of Object.entries(state.jFallidosDict)) {
                fallosHtml += `<div class="alert-error">❌ ${preg} ➔ ${info.traduccion}</div>`;
            }
            fallosHtml += `</div>`;
        } else {
            fallosHtml = `<div class="alert-success">🎉 ¡Excelente! No hubo fallas en esta sesión.</div>`;
        }
        
        return `
            <div class="main-header"><h3>📊 RESUMEN DE LA PARTIDA</h3></div>
            ${fallosHtml}
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button class="action-btn" onclick="reforzarFallas()">🏠 REFORZAR FALLAS</button>
                <button class="action-btn" onclick="volverAlJuego()">🎯 VOLVER AL JUEGO</button>
                <button class="action-btn action-btn-danger" onclick="salirAlInicio()">🚪 SALIR AL INICIO</button>
            </div>
        `;
    }

    function renderResumen() {
        let fallosHtml = "";
        if (Object.keys(state.jFallidosDict).length > 0) {
            for (const [preg, info] of Object.entries(state.jFallidosDict)) {
                fallosHtml += `<div class="alert-error">❌ ${preg} ➔ ${info.traduccion}</div>`;
            }
        } else {
            fallosHtml = `<div class="alert-success">No hay fallas registradas</div>`;
        }
        
        return `
            <div class="main-header"><h3>📝 REFUERZO DE FALLAS Y PENDIENTES</h3></div>
            <h4>❌ Registros fallados:</h4>
            ${fallosHtml}
            <button class="action-btn" onclick="cerrarResumen()">CERRAR</button>
            <button class="action-btn action-btn-success" onclick="reforzarFallas()">🏠 REFORZAR ESTO</button>
        `;
    }

    function renderRepaso() {
        if (state.data.length === 0) {
            return `<div class="alert-warning">No hay datos cargados. Configura los filtros en el panel lateral y haz clic en "CARGAR DATA".</div>`;
        }
        
        let html = `<div class="main-header"><h3>${state.catActiva.toUpperCase()} - NIVEL ${state.nivActivo}</h3></div>`;
        for (let i = 0; i < state.data.length; i++) {
            const palabra = obtenerPalabra(i);
            html += `
                <div class="review-item">
                    <div class="review-text">${i+1}. ${palabra.pregunta} ➔ ${palabra.respuesta}</div>
                    <div class="review-buttons">
                        <button onclick="speakWord('${palabra.respuesta}', '${palabra.lang}')">🔊</button>
                        <button onclick="entrenarPalabra(${i})">🎯</button>
                    </div>
                </div>
            `;
        }
        return html;
    }

    function renderEntrena() {
        if (state.data.length === 0) return `<div class="alert-warning">No hay datos cargados.</div>`;
        
        const palabra = obtenerPalabra(state.idxEntrena);
        const progreso = `${Math.floor(state.idxEntrena) + 1}/${state.data.length}`;
        
        if (state.autoEntrena) {
            return `
                <div class="alert-info" style="background:#2196F3; color:white; padding:15px; border-radius:8px;">
                    Modo Automático Activo: Relájate y escucha.
                </div>
                <div class="word-box">
                    <h3>ESPAÑOL:</h3>
                    <h1>${palabra.pregunta}</h1>
                </div>
                <button class="action-btn action-btn-danger" onclick="detenerAutoEntrena()">🛑 DETENER</button>
            `;
        }
        
        let contenidoExtra = "";
        if (state.entStep === 1) {
            contenidoExtra = `<div class="word-box" style="border-left-color:green;"><h1>${palabra.respuesta}</h1></div>`;
        }
        
        return `
            <div class="stat-box">${progreso}</div>
            <div class="word-box">
                <h3>TRADUCE:</h3>
                <h1>${palabra.pregunta}</h1>
            </div>
            ${contenidoExtra}
            <div style="display:flex; gap:10px; margin-top:20px;">
                <button class="action-btn" onclick="siguienteEntrena()">SIGUIENTE ➔</button>
                <button class="action-btn" onclick="reproducirAudioActual()">🔊 OÍR</button>
                <button class="action-btn action-btn-success" onclick="iniciarAutoEntrena()">🚀 MODO AUTO</button>
            </div>
        `;
    }

    // Funciones globales para los botones
    window.setAuthStep = (step) => { state.authStep = step; render(); };
    window.doLogin = () => {
        const pass = document.getElementById("loginPass")?.value;
        if (pass === "admin123" || pass === "peluche 02") {
            state.auth = true;
            state.usuarioActual = "Administrador";
            state.authStep = "inicio";
            showMessage("✅ Bienvenido!", "success");
            render();
        } else {
            showMessage("❌ Credenciales inválidas", "error");
        }
    };
    window.doRegistro = () => {
        showMessage("📧 Registro exitoso! Revisa tu correo (simulado)", "success");
        state.authStep = "inicio";
        render();
    };
    window.doRecuperar = () => {
        showMessage("📧 Si el correo existe, recibirás un enlace", "success");
        state.authStep = "inicio";
        render();
    };
    window.cerrarSesion = () => {
        state.auth = false;
        state.usuarioActual = null;
        state.jugando = false;
        state.data = [];
        state.totalP = 0;
        render();
    };
    window.cambiarIdioma = () => {
        const sel = document.getElementById("idiomaOri");
        if (sel) state.idiomaOri = sel.value;
        render();
    };
    window.cambiarCategoria = () => {
        const sel = document.getElementById("categoria");
        if (sel) state.catActiva = sel.value;
        render();
    };
    window.cambiarNivel = (nivel) => {
        state.nivActivo = nivel;
        render();
    };
    window.actualizarRango = () => {
        const ini = document.getElementById("rIni");
        const fin = document.getElementById("rFin");
        if (ini) state.rIni = parseInt(ini.value) || 1;
        if (fin) state.rFin = parseInt(fin.value) || state.totalP;
        render();
    };
    window.setMenu = (menu) => {
        state.menuActual = menu;
        state.viendoResumen = false;
        render();
    };
    window.speakWord = (text, lang) => speak(text, lang);
    window.entrenarPalabra = (idx) => {
        state.menuActual = "ENTRENA";
        state.idxEntrena = idx;
        state.entStep = 0;
        state.autoEntrena = false;
        render();
    };
    window.siguienteEntrena = () => {
        if (state.entStep === 0) {
            state.entStep = 1;
        } else {
            state.idxEntrena = (state.idxEntrena + 1) % state.data.length;
            state.entStep = 0;
        }
        render();
    };
    window.reproducirAudioActual = () => {
        if (state.jugando && state.cIdx !== undefined) {
            const palabra = obtenerPalabra(state.cIdx);
            speak(palabra.respuesta, palabra.lang);
        } else if (state.menuActual === "ENTRENA" && state.data[state.idxEntrena]) {
            const palabra = obtenerPalabra(state.idxEntrena);
            speak(palabra.respuesta, palabra.lang);
        }
    };
    window.reproducirAudioRespuesta = () => {
        if (state.jugando && state.cIdx !== undefined) {
            const palabra = obtenerPalabra(state.cIdx);
            speak(palabra.respuesta, palabra.lang);
        }
    };
    window.iniciarAutoEntrena = () => {
        state.autoEntrena = true;
        render();
        // Simular auto-entrenamiento
        let idx = state.idxEntrena;
        const interval = setInterval(() => {
            if (!state.autoEntrena) {
                clearInterval(interval);
                return;
            }
            if (idx >= state.data.length) {
                state.autoEntrena = false;
                clearInterval(interval);
                showMessage("✅ Auto-entrenamiento completado", "success");
                render();
                return;
            }
            const palabra = obtenerPalabra(idx);
            speak(palabra.respuesta, palabra.lang);
            idx++;
            state.idxEntrena = idx;
            render();
        }, 4000);
    };
    window.detenerAutoEntrena = () => {
        state.autoEntrena = false;
        render();
    };
    window.iniciarJuegoConfig = () => {
        const mod = document.getElementById("modJ")?.value;
        const orden = document.getElementById("ordenJ")?.value;
        const ayuda = document.getElementById("ayudaJ")?.value;
        if (mod) state.modJ = mod;
        if (orden) state.ordenJ = orden;
        if (ayuda) state.ayudaJuego = ayuda;
        iniciarJuego();
    };
    window.siguientePaso = () => {
        state.jPaso = 2;
        render();
    };
    window.comprobarRespuestaWrapper = () => comprobarRespuesta();
    window.siguientePalabraWrapper = () => siguientePalabra();
    window.iniciarGrabacion = () => {
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = state.idiomaOri === "Español" ? "es-ES" : "en-US";
            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                state.tempAns = transcript;
                const input = document.getElementById("respuestaInput");
                if (input) input.value = transcript;
                showMessage(`🎤 Escuché: "${transcript}"`, "success");
            };
            recognition.start();
        } else {
            showMessage("❌ Tu navegador no soporta reconocimiento de voz", "error");
        }
    };
    window.verResumen = () => {
        state.viendoResumen = true;
        render();
    };
    window.abortarJuego = () => {
        state.jugando = false;
        render();
    };
    window.cerrarResumen = () => {
        state.viendoResumen = false;
        render();
    };
    window.reforzarFallas = () => reforzarFallas();
    window.volverAlJuego = () => {
        state.jugando = false;
        state.viendoResumen = false;
        render();
    };
    window.salirAlInicio = () => {
        state.jugando = false;
        state.menuActual = "REPASO";
        state.viendoResumen = false;
        render();
    };

    // Inicialización
    cargarDatos();
</script>
</body>
</html>

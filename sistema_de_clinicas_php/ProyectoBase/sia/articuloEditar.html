<!DOCTYPE html>
<html>
    <head>
        [var.headJsCss;htmlconv=no]
         <title>Editar Artículo</title>
    </head>
     <body id="body" data-mensaje="[msj.mensaje]" data-tipo-mensaje="[msj.tipo_mensaje]">
        [var.cintillo;htmlconv=no]
        [var.encabezado;htmlconv=no]
        <div class="container">

              <!--MODAL PARA MENSAJE DE EXITO-->
            <div class="modal fade" id="successModal" tabindex="-1" aria-labelledby="successModalLabel" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header bg-success text-white">
                            <h5 class="modal-title" id="successModalLabel">Éxito</h5>
                            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            [msj.mensaje]
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- FIN DEL MODAL PARA MENSAJE DE EXITO-->

            <!--MODAL PARA MENSAJES DE ERROR-->
            <div class="modal fade" id="errorModal" tabindex="-1" aria-labelledby="errorModalLabel" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header bg-danger text-white">
                            <h5 class="modal-title" id="errorModalLabel">Error</h5>
                            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            [msj.mensaje]
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                        </div>
                    </div>
                </div>
            </div>
            <!--FIN DEL MODAL PARA MENSAJES DE ERROR-->

    
                <div class="row mb-3">       
                    <h2 class="titulo-pag" align="center">Editar Artículo</h2>
                        <p></p>       
                    <h2 style="text-align: right; font-family: sans-serif; font-size: 16px; color: #333; margin-right: 20px;">Usuario: [var.nombre] </h2>
           
                </div>

               

                <form name="formulario" action="articuloEditar.php" method="post" class="container mt-5"> 
                    <input type="hidden" name="id_articulo_actualizar" value="[articulo.id_articulo]">

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label for="nom_articulo" class="form-label">Nombre del Artículo</label>
                                <input type="text" name="nom_articulo" id="nom_articulo" class="form-control" title="Artículo" value="[articulo.nom_articulo]" autofocus required>      
                        </div>

                        <div class="col-md-4">  
                            <label for="id_medida" class="form-label negrita">Medida:</label>
                            <select name="id_medida" id="id_medida" class="form-select" title="Medida" required>
                                <option value="">Seleccionar</option>
                                [medida;block=begin]
                                <option value="[articulo.id_medida]"[onshow; if [articulo.id_medida]==[articulo.id_medida]; then 'selected']>
                                    [articulo.nom_medida]
                                </option>
                                [medida;block=end]
                            </select>
                        </div>



                        <div class="col-md-4">  
                            <label for="id_clasificacion" class="form-label negrita">Clasificación:</label>
                            <select name="id_clasificacion" id="id_clasificacion" class="form-select" title="Clasificación" required>
                                <option value="">Seleccionar</option>
                                [clasificacion;block=begin]
                                <option value="[articulo.id_clasificacion]"[onshow; if [articulo.id_clasificacion]==[articulo.id_clasificacion]; then ' selected']>
                                    [articulo.nom_clasificacion]
                                </option>
                                [clasificacion;block=end]
                            </select>
                        </div>


                    <div class="row">
                        <p></p>
                        <div class="col-md-7 text-center">
                           <button  name="Cancelar" class="btn btn-outline-secondary" type="button" onclick="window.location.href='articulo.php'">Cancelar</button>
                        </div>
                        <div class="col-md-1 text-right">
                            <button name="Guardarcambios" class="btn btn-outline-primary" type="submit" value="[articulo.id_articulo]">Actualizar</button> 
                        </div>
                        <p></p>
                    </div>
                    </form>
                    

                </div>
            </div>
               
            [var.pie;htmlconv=no]
    </body>
</html>

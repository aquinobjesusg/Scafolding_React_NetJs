<!DOCTYPE html>
<html>
    <head>
    [var.headJsCss;htmlconv=no]

    </head>
<body id="body" data-mensaje="[msj.mensaje]" data-tipo-mensaje="[msj.tipo_mensaje]">

    [var.encabezado;htmlconv=no]

          
    <div class="container">

            <div class="row mb-3">

                    <div class="modal-content">
                        <div class="modal-header bg-success text-white">
                            <h5 class="modal-title" id="successModalLabel">Éxito</h5>

                        </div>
                        <div class="modal-body">
                            [msj.mensaje]
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- FIN DEL MODAL PARA MENSAJE DE EXITO-->

            <!--MODAL PARA MENSAJES DE ERROR-->

                    <div class="modal-content">
                        <div class="modal-header bg-danger text-white">
                            <h5 class="modal-title" id="errorModalLabel">Error</h5>
                            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            [msj.mensaje]

                        </div>
                    </div>
                </div>

            <h2 class="titulo-pag" align="center">Editar Clasificacion</h2>
                <p></p>       
                <h2 style="text-align: right; font-family: sans-serif; font-size: 16px; color: #333; margin-right: 20px;">Usuario: [var.nombre]</h2>



            <form name="formulario" action="bienesClasificacionEditar.php" method="post" class="mt-5">
            
            <input type="hidden" name="id_clasificacionbien_actualizar" value="[clasificacion.id_clasificacionbien]">
                
            <div class="row justify-content-center">
                <div class="col-md-4">
                    <label for="nom_clasificacionbien" class="form-label negrita">Nombre de la Clasificacion:</label>
                    <input type="text" name="nom_clasificacionbien" id="nom_clasificacionbien" value="[clasificacion.nom_clasificacionbien]" class="form-control" title="Escribe el nombre de la Clasificacion" autofocus required>
                </div>
            </div>

            <div class="row mt-4 justify-content-center">
                <div class="col-md-2 text-center">
                    <button class="btn btn-outline-secondary w-100" type="button" 
                            onclick="window.location.href='bienesClasificacion.php'">Cancelar</button>
                </div>
                <div class="col-md-2 text-center">
                    <button name="Guardarcambios" class="btn btn-outline-success w-100" type="submit">Actualizar</button> 
                </div>
            </div>
        </form>
            </div>
        </div>
    
        [var.pie;htmlconv=no]

<!DOCTYPE html>
<html>
<head>
    [var.headJsCss;htmlconv=no]
    <title>Editar Registro de Bienes</title>
</head>
<body id="body" data-mensaje="[msj.mensaje]" data-tipo-mensaje="[msj.tipo_mensaje]">
    [var.cintillo;htmlconv=no]
    [var.encabezado;htmlconv=no]

    <div class="container">

        <!--MODAL PARA MENSAJE DE EXITO-->
        <div class="modal fade" id="successModal" tabindex="-1" aria-labelledby="successModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header bg-success text-white">
                        <h5 class="modal-title" id="successModalLabel">Éxito</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        [msj.mensaje]
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- FIN DEL MODAL PARA MENSAJE DE EXITO-->

        <!--MODAL PARA MENSAJES DE ERROR-->
        <div class="modal fade" id="errorModal" tabindex="-1" aria-labelledby="errorModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header bg-danger text-white">
                        <h5 class="modal-title" id="errorModalLabel">Error</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        [msj.mensaje]
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    </div>
                </div>
            </div>
        </div>
        <!--FIN DEL MODAL PARA MENSAJES DE ERROR-->

        <div class="row mb-3">
            <h2 class="titulo-pag" align="center">Editar Registro de Bien</h2>
            <p></p>
            <h2 style="text-align: right; font-family: sans-serif; font-size: 16px; color: #333; margin-right: 20px;">Usuario: [var.nombre]</h2>
        </div>
        
        <!--FORMULARIO PARA EDITAR UN BIEN-->
        <div class="container">
            <form name="formEditarBienes" id="formEditarBienes" action="bienesEditar.php" method="post">
                <input type="hidden" name="id_bienes_actualizar" value=[bien.id_bienes]>
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label for="codigo_viejo_edit" class="form-label negrita">Antiguo Codigo:</label>
                        <input type="text" name="codigo_viejo_edit" id="codigo_viejo_edit" value="[bien.codigo_viejo]" class="form-control" title="Antiguo Codigo del Bien">
                    </div>
                    <div class="col-md-4">
                        <label for="codigo_bienes_edit" class="form-label negrita">Nuevo Codigo:</label>
                        <input type="text" name="codigo_bienes_edit" id="codigo_bienes_edit" value="[bien.codigo_bienes]" class="form-control" title="Nuevo Codigo del Bien" required="required">
                    </div>
                    <div class="col-md-4">
                        <label for="fecha_ingresob_edit" class="form-label negrita">Fecha de Incorporacion:</label>
                        <input type="date" name="fecha_ingresob_edit" id="fecha_ingresob_edit" value="[bien.fecha_ingresob]" class="form-control" title="Fecha de Incorporacion" required="required">
                        <div id="fechaIngresoError2" class="form-text text-danger" style="display: none;">Formato de fecha inválido.
                        </div>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-4">
                        <label for="equipob_edit" class="form-label negrita">Equipo:</label>
                        <input type="text" name="equipob_edit" id="equipob_edit" value="[bien.equipob]" class="form-control" title="Equipo" required="required">
                    </div>
                    <div class="col-md-4">
                        <label for="marca_edit" class="form-label negrita">Marca:</label>
                        <input type="text" name="marca_edit" id="marca_edit" value="[bien.marca]" class="form-control" title="Marca">
                    </div>
                    <div class="col-md-4">
                        <label for="modelo_edit" class="form-label negrita">Modelo:</label>
                        <input type="text" name="modelo_edit" id="modelo_edit" value="[bien.modelo]" class="form-control" title="Modelo">
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-4">
                        <label for="serial_edit" class="form-label negrita">Serial:</label>
                        <input type="text" name="serial_edit" id="serial_edit" value="[bien.serial]" class="form-control" title="Serial">
                    </div>
                    <div class="col-md-4">
                        <label for="color_edit" class="form-label negrita">Color:</label>
                        <input type="text" name="color_edit" id="color_edit" value="[bien.color]" class="form-control" title="Color">
                    </div>
              

                    <div class="col-md-4">  
                        <label for="id_estado_edit" class="form-label negrita">Estado:</label>
                        <select name="id_estado_edit" id="id_estado_edit" class="form-select" title="Estado" required>
                            <option value="">Seleccionar</option>
                            [estados;block=begin]
                            <option value="[estados.id_estado]" [onshow; if [estados.id_estado]==[estados.id_estado]; then 'selected']>
                                [estados.nom_estado]
                            </option>
                            [estados;block=end]
                        </select>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-8">
                        <label for="especificacion_edit" class="form-label negrita">Especificaciones:</label>
                        <input type="text" name="especificacion_edit" id="especificacion_edit" value="[bien.especificacion]" class="form-control" title="Especificaciones del Bien">
                    </div>
                  
                    <div class="col-md-4">  
                        <label for="id_clasificacionbien_edit" class="form-label negrita">Clasificación:</label>
                        <select name="id_clasificacionbien_edit" id="id_clasificacionbien_edit" class="form-select" title="Clasificación" required>
                            <option value="">Seleccionar</option>
                            [clasificacion;block=begin]
                            <option value="[clasificacion.id_clasificacionbien]" [onshow; if [clasificacion.id_clasificacionbien]==[bien.id_clasificacionbien]; then 'selected']>
                                [clasificacion.nom_clasificacionbien]
                            </option>
                            [clasificacion;block=end]
                        </select>
                    </div>
                                       
                </div>
                <div>
                    <p></p>
                    <br>
                </div>
                <div class="row mb-3">
                    <div class="col-md-4">
                        <label for="fecha_adquisicion_edit" class="form-label negrita">Fecha de Adquisicion:</label>
                        <input type="date" name="fecha_adquisicion_edit" id="fecha_adquisicion_edit" value="[bien.fecha_adquisicion]" class="form-control" title="Fecha de Adquisicion">
                    </div>
                   
                    <div class="col-md-4">  
                        <label for="id_concepto_edit" class="form-label negrita">Concepto:</label>
                        <select name="id_concepto_edit" id="id_concepto_edit" class="form-select" title="Concepto">
                            <option value="">Seleccionar</option>
                            [conceptos;block=begin]
                            <option value="[conceptos.id_concepto]" [onshow; if [conceptos.id_concepto]==[bien.id_concepto]; then 'selected']>
                                [conceptos.nom_concepto]
                            </option>
                            [conceptos;block=end]
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label for="precio_bien_edit" class="form-label negrita">Precio:</label>
                        <input type="number" step="0.01" name="precio_bien_edit" id="precio_bien_edit" value="[bien.precio_bien]" class="form-control" title="Precio del Bien">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 text-center">
                        <a class="btn btn-outline-secondary " href="bienesListado.php" role="button" data-bs-toggle="tooltip" title="Cancelar">Cancelar</a> 
                    </div>
                    <div class="col-md-4 text-center">
                        <button type="submit" class="btn btn-outline-primary" name="GuardarCambios" title="Guardar Cambios">Guardar Cambios</button>
                    </div>
                </div>
                <div><br></div>
            </form>
        </div> 
        <!--FIN DEL FORMULARIO PARA REGISTRAR UN BIEN-->
    </div> 
    <!-- FIN DEL CONTAINER PRINCIPAL-->
    <!--PIE DE PAGINA-->
    [var.pie;htmlconv=no]
    <script src="js/funcionesValidar.js"></script>
    <script src="js/bienes.js"></script>
    <script src="js/bienesEditar.js"></script>
</body>
</html>

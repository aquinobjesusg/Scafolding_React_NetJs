<!DOCTYPE html>
<html>
<head>
    [var.headJsCss;htmlconv=no]
    <title>Registro de Estado</title>
</head>
<body id="body" data-mensaje="[msj.mensaje]" data-tipo-mensaje="[msj.tipo_mensaje]">
    [var.cintillo;htmlconv=no]
    [var.encabezado;htmlconv=no]

    <div class="container">

        <!--MODAL PARA MENSAJE DE EXITO-->
        <div class="modal fade" id="successModal" tabindex="-1" aria-labelledby="successModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header bg-success text-white">
                        <h5 class="modal-title" id="successModalLabel">Éxito</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        [msj.mensaje]
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- FIN DEL MODAL PARA MENSAJE DE EXITO-->

        <!--MODAL PARA MENSAJES DE ERROR-->
        <div class="modal fade" id="errorModal" tabindex="-1" aria-labelledby="errorModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header bg-danger text-white">
                        <h5 class="modal-title" id="errorModalLabel">Error</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        [msj.mensaje]
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    </div>
                </div>
            </div>
        </div>
        <!--FIN DEL MODAL PARA MENSAJES DE ERROR-->

        <div class="row mb-3">
            <h2 class="titulo-pag" align="center">Registro de Estado</h2>
            <p></p>
            <h2 style="text-align: right; font-family: sans-serif; font-size: 16px; color: #333; margin-right: 20px;">Usuario: [var.nombre]</h2>
        </div>
        
        <!--FORMULARIO PARA REGISTRAR UN ESTADO NUEVO PARA LOS BIENES-->
        <div class="container">
            <form name="formulario_estado" id="formEstado" action="bienesEstado.php" method="post">
                <div class="row justify-content-center">
                    <div class="col-md-4">
                        <label for="nom_estado" class="form-label negrita">Nombre del Estado:</label>
                        <input type="text" name="nom_estado" id="nom_estado" class="form-control" title="Escribe el Nuevo Estado" autofocus required>
                    </div>
                </div>
                <p></p>
                <p></p>
                <div class="row">
                    <div class="col-md-12 text-center">
                        <input type="submit" class="btn btn-outline-primary" name="Registrar" value="Registrar" title="Registrar Nuevo Estado">
                    </div>
                </div>
                <p></p>
            </form>
        </div> 
        <!--FIN DEL FORMULARIO PARA REGISTRAR UN ESTADO NUEVO PARA LOS BIENES-->
           <p></p>
                    <div class="row mb-3">       
                        <h2  class="titulo-pag" align="center">Listado de Estado de Bien</h2>
                    </div>
                     <div class="table-responsive-sm">
                        <table class="tabla table table-hover">
                            <thead class="encabezadoTabla">
                                    <tr>
                                        <th>N°</th>
                                        <th>Nombre</th>
                                        <th>Accion</th>
                                     </tr>
                                </thead>
                            <tbody>
                                        
                                    <tr [listadoEstado;block=tr]>
                                        <td>[listadoEstado.#]</td>
                                        <td>[listadoEstado.nom_estado]</td>
                                        <td>
                                     
                                        <form name="tbs1" action="bienesEstadoEditar.php" method="post">
                                            <button name="Editar" title="Editar Estado" class="btn-acciones" type="submit" value="[listadoEstado.id_estado]">
                                                                <i class="fa-solid fa-pen-to-square"></i>
                                            </button>
                                        </form>
                                          
                                        </td> 
                                    </tr> 
                            </tbody>
                        </table>
                    </div>
                </div>

    </div> 
    <!-- FIN DEL CONTAINER PRINCIPAL-->
    <!--PIE DE PAGINA-->
    [var.pie;htmlconv=no]
</body>
</html>

<!DOCTYPE html>
<html>
    <head>
        [var.headJsCss;htmlconv=no]
        <title>Cambiar Contraseña</title>
    </head>
   <body id="body" data-mensaje="[msj.mensaje]" data-tipo-mensaje="[msj.tipo_mensaje]">
                [var.cintillo;htmlconv=no]
                [var.encabezado;htmlconv=no]

        <div class="container">

          <!--MODAL PARA MENSAJE DE EXITO-->
            <div class="modal fade" id="successModal" tabindex="-1" aria-labelledby="successModalLabel" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header bg-success text-white">
                            <h5 class="modal-title" id="successModalLabel">Éxito</h5>
                            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            [msj.mensaje]
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- FIN DEL MODAL PARA MENSAJE DE EXITO-->

            <!--MODAL PARA MENSAJES DE ERROR-->
            <div class="modal fade" id="errorModal" tabindex="-1" aria-labelledby="errorModalLabel" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header bg-danger text-white">
                            <h5 class="modal-title" id="errorModalLabel">Error</h5>
                            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            [msj.mensaje]
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                        </div>
                    </div>
                </div>
            </div>
            <!--FIN DEL MODAL PARA MENSAJES DE ERROR-->

            <div class="row mb-3">       
                <h2 class="titulo-pag" align="center">Cambio de Contraseña</h2>
                  <p></p>       
             <h2 style="text-align: right; font-family: sans-serif; font-size: 16px; color: #333; margin-right: 20px;">Usuario: [var.nombre]</h2>
            </div>


           
               
                <form name="tbs" action="cambiarContrasenia.php" method="post" class="login-form d-flex flex-column align-items-center mt-5">

                    <div class="form-group mb-3">
                        <label for="clave_actual" class="form-label">Contraseña Actual</label>
                        <input type="password" name="clave_actual" id="clave_actual" class="form-control" 
                                               title="Contraseña" >
                    </div>

                     <div class="form-group mb-3 position-relative">
                        <label for="nueva_clave" class="form-label">Nueva Contraseña</label>
                        <input type="password" name="nueva_clave" id="nueva_clave" class="form-control" title="Contraseña Nueva">
                        <span class="password-toggle-icon" onclick="togglePasswordVisibility('nueva_clave', this)">
                            <i class="fas fa-eye"></i>
                        </span>
                    </div>

                    <div class="form-group mb-3 position-relative">
                        <label for="confirmar_clave" class="form-label">Confirmar Nueva Contraseña</label>
                        <input type="password" name="confirmar_clave" id="confirmar_clave" class="form-control" title="Confirmar Contraseña Nueva">
                        <span class="password-toggle-icon" onclick="togglePasswordVisibility('confirmar_clave', this)">
                            <i class="fas fa-eye"></i>
                        </span>
                    </div>                   
     
                    <button type="submit" align ="center" name="Actualizar" class="btn btn-outline-primary" data-bs-toggle="tooltip" title="Actualizar" class="btn btn-dark">Actualizar</button>
                </form>

                <p></p> 
            </div>

            
            [var.pie;htmlconv=no]
    </body>
</html>

<!DOCTYPE html>
<html>
    <head>
        [var.headJsCss;htmlconv=no]
        <title>Editar Clasificación</title>
    </head>
    <body id="body" data-mensaje="[msj.mensaje]" data-tipo-mensaje="[msj.tipo_mensaje]">
                [var.cintillo;htmlconv=no]
                [var.encabezado;htmlconv=no]

            <div class="container">

                <!--MODAL PARA MENSAJE DE EXITO-->
                <div class="modal fade" id="successModal" tabindex="-1" aria-labelledby="successModalLabel" aria-hidden="true">
                    <div class="modal-dialog modal-dialog-centered">
                        <div class="modal-content">
                            <div class="modal-header bg-success text-white">
                                <h5 class="modal-title" id="successModalLabel">Éxito</h5>
                                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <div class="modal-body">
                                [msj.mensaje]
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- FIN DEL MODAL PARA MENSAJE DE EXITO-->

                <!--MODAL PARA MENSAJES DE ERROR-->
                <div class="modal fade" id="errorModal" tabindex="-1" aria-labelledby="errorModalLabel" aria-hidden="true">
                    <div class="modal-dialog modal-dialog-centered">
                        <div class="modal-content">
                            <div class="modal-header bg-danger text-white">
                                <h5 class="modal-title" id="errorModalLabel">Error</h5>
                                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <div class="modal-body">
                                [msj.mensaje]
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                            </div>
                        </div>
                    </div>
                </div>
                <!--FIN DEL MODAL PARA MENSAJES DE ERROR-->
                   
                    <div class="row mb-3">       
                        <h2 class="titulo-pag" align="center">Editar Clasificación</h2>
                          <p></p>       
                         <h2 style="text-align: right; font-family: sans-serif; font-size: 16px; color: #333; margin-right: 20px;">Usuario: [var.nombre]</h2>

                    </div>


                <form name="tbs" action="clasificacionEditar.php" method="post" class="container mt-5">
                    <input type="hidden" name="id_clasificacion_actualizar" value="[clasificacion.id_clasificacion]">
                        <div class="row justify-content-center">
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="nom_clasificacion" class="form-label">Nombre de Clasificación</label>
                                    <input type="text" name="nom_clasificacion" value="[clasificacion.nom_clasificacion]" id="nom_clasificacion" class="form-control" title="Clasificacion" autofocus required>
                                </div>
                            </div>

                            <div class="row">
                                <p></p>
                                <div class="col-md-7 text-center">
                                   <button  name="Cancelar" class="btn btn-outline-secondary" type="button" onclick="window.location.href='clasificacion.php'">Cancelar</button>
                                </div>
                                <div class="col-md-1 text-right">
                                    <button name="Guardarcambios" class="btn btn-outline-primary" type="submit" value="[clasificacion.id_clasificacion]">Actualizar</button> 
                                </div>
                                <p></p>
                            </div>
                            </div>
                        </div>
                    </form>
                    <p></p>

                

            [var.pie;htmlconv=no]
    </body>
</html>

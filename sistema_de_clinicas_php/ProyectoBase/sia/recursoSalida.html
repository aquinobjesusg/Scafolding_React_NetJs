<!DOCTYPE html>
<html>
<head> 
    [var.headJsCss;htmlconv=no]
    <title>Registro de distribucion de recursos</title>
    
</head>
    
       <body id="body" data-mensaje="[msj.mensaje]" data-tipo-mensaje="[msj.tipo_mensaje]">
        [var.cintillo;htmlconv=no]
        [var.encabezado;htmlconv=no]

        <div class="container">
                <!--MODAL PARA MENSAJE DE EXITO-->
        <div class="modal fade" id="successModal" tabindex="-1" aria-labelledby="successModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header bg-success text-white">
                        <h5 class="modal-title" id="successModalLabel">Éxito</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        [msj.mensaje]
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- FIN DEL MODAL PARA MENSAJE DE EXITO-->

        <!--MODAL PARA MENSAJES DE ERROR-->
        <div class="modal fade" id="errorModal" tabindex="-1" aria-labelledby="errorModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header bg-danger text-white">
                        <h5 class="modal-title" id="errorModalLabel">Error</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        [msj.mensaje]
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                    </div>
                </div>
            </div>
        </div>
        <!--FIN DEL MODAL PARA MENSAJES DE ERROR-->

            <div class="row mb-3">       
                <h2 class="titulo-pag" align="center">Registro de Distribución de Recursos</h2>
                <p></p>       
                    <h2 style="text-align: right; font-family: sans-serif; font-size: 16px; color: #333; margin-right: 20px;">Usuario: [var.nombre]</h2>
            </div>

          
            <div class="container">
                <form name="tbs" action="recursoSalida.php" method="post">
                    <div class="row mb-3">
                      <div class="col-md-4">
                            <label for="orden_salida" class="form-label negrita">Orden de Salida:</label>
                            <input type="text" name="orden_salida" id="orden_salida" value="[orden_salida_auto]" class="form-control" title="Orden de Salida" required="required" readonly>
                        </div>
                                                <div class="col-md-4">
                            <label for="fecha_salida" class="form-label negrita">Fecha:</label>
                            <input type="date" name="fecha_salida" id="fecha_salida" class="form-control" title="Fecha"  required="required">
                        </div>
                    </div>
                       <div class="row mb-3">
                        <div class="col">
                            <label for="select_ente" class="form-label negrita">Ente *:</label>
                            <select name="id_ente" id="select_ente" class="form-select selector-dependiente" data-next="general" required>
                                <option value="">Seleccionar</option>
                                <option value="[ente.id_ente;block=option]">[ente.nom_ente]</option>
                            </select>
                        </div>

                        <div class="col">
                            <label for="select_general" class="form-label negrita">Dirección General *:</label>
                            <select name="id_direccion_general" id="select_general" class="form-select selector-dependiente" data-next="linea" disabled required>
                                <option value="">Seleccionar</option>
                            </select>
                        </div>

                        <div class="col">
                            <label for="select_linea" class="form-label negrita">Dirección de Línea:</label>
                            <select name="id_direccion_linea" id="select_linea" class="form-select selector-dependiente" data-next="coordinacion" disabled>
                                <option value="0">Seleccionar</option>
                            </select>
                        </div>

                        <div class="col">
                            <label for="select_coordinacion" class="form-label negrita">Coordinación:</label>
                            <select name="id_coordinacion" id="select_coordinacion" class="form-select selector-dependiente" data-next="funcionario" disabled>
                                <option value="0">Seleccionar</option>
                            </select>
                        </div>

                     
                    </div>
                    <div class="row mb-3">
                         <div class="col-md-4">
                            <label for="id_almacen" class="form-label negrita">Almacen:</label>
                            <select name="id_almacen" id="sel_continent" class="form-select" required>
                                <option value="">Seleccionar</option>
                                <option value="[almacen.id_almacen;block=option]">[almacen.nom_almacen]</option>
                            </select>
                        </div>
                    </div>

                     <div id="articulos-wrapper">
                    <!-- Fila Original - SIEMPRE primera con botón + -->
                    <div class="row mb-3 articulo-item articulo-original">
                        <div class="col-md-4">
                            <label class="form-label negrita">Artículo:</label>
                            <select name="id_articulo[]" class="form-select articulo-select" title="Artículo" required>
                                <option value="">Seleccione un almacén primero</option>
                            </select>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label negrita">Cantidad:</label>
                            <input type="number" name="cantidad_salida[]" class="form-control cantidad-input" title="Cantidad a Distribuir" placeholder="Ingrese un número" min="1" required>
                        </div>
                        
                        <div class="col-md-3">
                            <label class="form-label negrita">Observación:</label>
                            <input type="text" name="observacion_s[]" class="form-control" title="Observación" placeholder="Observación opcional">
                        </div>
                        
                        <div class="col-md-2 d-flex align-items-end">
                            <button type="button" class="btn-acciones-plus add-articulo-btn" title="Agregar Artículo">
                                <i class="fa-solid fa-plus"></i>
                            </button>
                        </div>
                    </div>
                    <!-- Las filas agregadas se insertarán aquí DESPUÉS del original -->
                </div>


                    <div class="row">
                        <div class="col-md-12 text-center">
                            <input type="submit" class="btn btn-outline-primary" name="Registrar" value="Registrar">
                        </div>
                    </div>

                </form>
            </div>
                   <p></p>
               
             

    </div>
        
        [var.pie;htmlconv=no]

    <script src="js/recursoSalida.js"></script>

    </body>
</html>

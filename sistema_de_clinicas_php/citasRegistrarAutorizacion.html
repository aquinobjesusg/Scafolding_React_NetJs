<script>
	document.addEventListener('DOMContentLoaded', function () {
		
		const selEspecialidad = document.getElementById('id_especialidad');
		const selMedico = document.getElementById('id_medico');

		selEspecialidad.addEventListener('change', function () {
			const idEsp = this.value;

			// Limpia y muestra carga
			selMedico.innerHTML = '<option value="">Cargando...</option>';

			if (!idEsp) {
				selMedico.innerHTML = '<option value="">Seleccionar</option>';
				return;
			}

			fetch('obtenerMedicos.php?id_especialidad=' + encodeURIComponent(idEsp))
				.then(r => {
					if (!r.ok) throw new Error('Error HTTP ' + r.status);
					return r.text();
				})
				.then(html => {
					selMedico.innerHTML = html;
				})
				.catch(err => {
					console.error(err);
					selMedico.innerHTML = '<option value="">Error al cargar médicos</option>';
				});
		});

		// Si vienes con una especialidad ya seleccionada (por edición), dispara el change
		if (selEspecialidad.value) {
			selEspecialidad.dispatchEvent(new Event('change'));
		}
	});

	document.addEventListener('DOMContentLoaded', function () {
		const fecha_nacimiento_titular = document.getElementById('fecha_nacimiento_titular');
		fecha_nacimiento_titular.addEventListener('change', function () {
			const fecha = this.value;

		});
	});

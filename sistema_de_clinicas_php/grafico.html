<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gráfico de Torta con Chart.js</title>
    <!-- Importamos Chart.js desde su CDN oficial -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f7f6;
        }
        .contenedor-grafico {
            width: 450px;
            height: 450px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="contenedor-grafico">
        <!-- El gráfico se renderizará obligatoriamente dentro de una etiqueta canvas -->
        <canvas id="miGraficoDeTorta"></canvas>
    </div>

    <script>
        // 1. Obtener la referencia del elemento canvas del HTML
        const ctx = document.getElementById('miGraficoDeTorta').getContext('2d');

        // 2. Definir los datos que se mostrarán en la torta
        const datosGrafico = {
            labels: ['Manzanas', 'Arándanos', 'Plátanos', 'Naranjas'], // Porciones
            datasets: [{
                label: 'Cantidad de Frutas',
                data: [12, 19, 3, 8], // Valores numéricos correlativos
                backgroundColor: [
                    'rgba(255, 99, 132, 0.7)',  // Color Manzanas
                    'rgba(54, 162, 235, 0.7)', // Color Arándanos
                    'rgba(255, 206, 86, 0.7)', // Color Plátanos
                    'rgba(75, 192, 192, 0.7)'  // Color Naranjas
                ],
                borderColor: [
                    'rgba(255, 99, 132, 1)',
                    'rgba(54, 162, 235, 1)',
                    'rgba(255, 206, 86, 1)',
                    'rgba(75, 192, 192, 1)'
                ],
                borderWidth: 1
            }]
        };

        // 3. Crear e inicializar el gráfico de tipo 'pie' (torta)
        const miTorta = new Chart(ctx, {
            type: 'pie', // Especifica que es un gráfico de torta
            data: datosGrafico,
            options: {
                responsive: true, // Se adapta al tamaño del contenedor
                plugins: {
                    legend: {
                        position: 'top', // Posición de las etiquetas informativas
                    },
                    title: {
                        display: true,
                        text: 'Distribución de Inventario de Frutas' // Título principal
                    }
                }
            }
        });
    </script>

</body>
</html>

<!-- SCRIPT JS PARA MANEJAR CAMPOS OCULTOS Y REPROGRAMACIÓN -->
<script>
document.addEventListener("DOMContentLoaded", function() {
    const valoresNulos = ["", "-", "N/A", "NO APLICA", "NINGUNO", "NINGUNA", "NULL"];

    // 1. Ocultar contenedores vacíos (Ente, Universidad, etc.)
    const contenedores = document.querySelectorAll('.campo-contenedor');
    contenedores.forEach(contenedor => {
        const elementoInput = contenedor.querySelector('input');
        if (elementoInput) {
            const texto = elementoInput.value.trim().toUpperCase();
            if (valoresNulos.includes(texto) || texto.length === 0 || texto === "AÑOS") {
                contenedor.style.display = 'none';
            }
        }
    });

    // 2. Si Titular es igual a Paciente, ocultar Paciente
    const txtTitular = document.getElementById('txt-titular');
    const txtPaciente = document.getElementById('txt-paciente');
    const contenedorPaciente = document.getElementById('contenedor-paciente');

    if (txtTitular && txtPaciente && contenedorPaciente) {
        const valTitular = txtTitular.value.trim().toUpperCase();
        const valPaciente = txtPaciente.value.trim().toUpperCase();

        if (valTitular === valPaciente) {
            contenedorPaciente.style.display = 'none';
        }
    }

    // 3. Manejo dinámico del campo Nueva Fecha al Reprogramar
    const selectEstado = document.getElementById('select-estado-cita');
    const contenedorNuevaFecha = document.getElementById('contenedor-nueva-fecha');
    const inputNuevaFecha = document.getElementById('nueva_fecha_cita');

    if (selectEstado && contenedorNuevaFecha) {
        function evaluarEstado() {
            const opcionTexto = selectEstado.options[selectEstado.selectedIndex].text.trim().toLowerCase();
            
            if (opcionTexto.includes('reprogram')) {
                contenedorNuevaFecha.style.display = 'block';
                if (inputNuevaFecha) {
                    inputNuevaFecha.setAttribute('required', 'required');
                }
            } else {
                contenedorNuevaFecha.style.display = 'none';
                if (inputNuevaFecha) {
                    inputNuevaFecha.removeAttribute('required');
                    inputNuevaFecha.value = '';
                }
            }
        }

        selectEstado.addEventListener('change', evaluarEstado);
        evaluarEstado(); // Verificación inicial al cargar la página
    }
});
</script>
